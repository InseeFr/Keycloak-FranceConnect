agentconnect.mfa.label=Double authentification (2FA)
agentconnect.mfa.value.disabled=Désactivé : aucune 2FA n''est demandée (un utilisateur qui en a une malgré tout reste accepté)
agentconnect.mfa.value.optional=Optionnel : la 2FA est demandée mais pas exigée (les utilisateurs qui ne l''ont pas se connectent quand même)
agentconnect.mfa.value.required=Obligatoire : la 2FA est exigée (la connexion est refusée sans ACR MFA)
agentconnect.mfa.tooltip=Contrôle la double authentification ProConnect via le paramètre OIDC claims. Le niveau eIDAS filtre les valeurs ACR MFA demandées (eidas0-mfa, eidas1-mfa, eidas2, eidas3).

agentconnect.eidas.label=Niveau de garantie eIDAS
agentconnect.eidas.value.eidas1=eidas 1 : niveau standard (exemple : authentification par identifiant / mot de passe)
agentconnect.eidas.value.eidas2=eidas 2 : niveau substantiel (exemple : second facteur. Homologué eIDAS)
agentconnect.eidas.value.eidas3=eidas 3 : niveau élevé (exemple : utilisation de certificats, lecteurs de cartes, ... Homologué eIDAS)
agentconnect.eidas.tooltip=Permet de fixer le niveau de garantie minimum du compte utilisateur. En mode 2FA, filtre les valeurs ACR MFA envoyées dans le paramètre claims. Effet : désactive des fournisseurs d''identités (FI) sur la page de login AgentConnect.

