franceconnect.eidas.label=Niveau de garantie eIDAS
franceconnect.eidas.value.eidas1=eidas 1 : niveau standard (exemple : authentification par identifiant / mot de passe)
franceconnect.eidas.value.eidas2=eidas 2 : niveau substantiel (exemple : second facteur. Homologué eIDAS)
franceconnect.eidas.value.eidas3=eidas 3 : niveau élevé (exemple : utilisation de certificats, lecteurs de cartes, ... Homologué eIDAS)
franceconnect.eidas.tooltip=Permet de fixer le niveau de garantie du compte utilisateur souhaité. Effet : désactive des fournisseurs d''identités (FI) sur la page de login FranceConnect.

